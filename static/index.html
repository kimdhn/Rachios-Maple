
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maple Lobby</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="pageNav" class="page-nav">
    <button id="homePageBtn" class="active" disabled>홈</button>
    <button id="famePageBtn" onclick="location.href='/fame'">명예의 전당</button>
    <button onclick="location.href='/octopus'">황금문어</button>
  </div>
  <div id="topbar">
    <div class="glass-pill world-pill">
      <img class="world-badge" src="/static/favicon.ico" alt="" />
      <div><strong>사자가 메이플 할 때!</strong><small>2026 애한제</small></div>
    </div>
    <div class="glass-pill slot-pill"><span>광장 캐릭터</span><span id="slotCount">-</span></div>
    <button id="rankToggleBtn" class="glass-pill toggle-pill" type="button" aria-expanded="false">
      <span>순위 보기</span><span class="chev"></span>
    </button>
    <div id="rankMenu" class="ranks hidden">
      <button data-rank="level">레벨</button>
      <button data-rank="power">전투력</button>
      <button data-rank="popularity">인기</button>
      <button data-rank="created">생성일</button>
    </div>
    <div id="panel" class="panel hidden"></div>
    <div class="controls card">
      <div class="card-title">캐릭터 등록</div>
      <div class="card-inner">
        <input id="nameInput" type="text" placeholder="캐릭터 닉네임" />
        <div class="card-sub">
          <div class="card-sub-label">관리</div>
          <div class="row">
            <button id="removeQueueBtn" class="danger">제거</button>
            <button id="cleanQueueBtn" class="danger">집 보내기</button>
            <button id="toggleScannerBtn">QR 스캔</button>
            <button id="reloadBtn">새로고침</button>
          </div>
          <div class="row db-row">
            <button id="visitorsBtn">방문 확인</button>
            <button id="deleteNameBtn" class="danger">캐릭터 삭제</button>
            <button id="cleanDbBtn" class="danger" hidden>DB 비우기</button>
          </div>
        </div>
      </div>
      <button id="addNameBtn" class="start-btn">추가</button>
    </div>
  </div>

  <div id="scannerWrap" class="hidden">
    <div class="scanner-header">
      <strong>QR 스캔</strong>
      <button id="cancelScannerBtn" type="button">취소</button>
    </div>
    <video id="readerVideo" playsinline muted></video>
  </div>

  <canvas id="scene" width="1280" height="720"></canvas>
  <div id="passwordModal" class="modal-backdrop hidden">
    <form id="passwordForm" class="modal" autocomplete="off">
      <strong id="passwordTitle">관리 비밀번호</strong>
      <p id="passwordMessage"></p>
      <input id="passwordInput" type="password" placeholder="관리 비밀번호" autocomplete="current-password" />
      <div class="modal-actions">
        <button id="passwordCancelBtn" type="button">취소</button>
        <button id="passwordSubmitBtn" type="submit" class="danger">확인</button>
      </div>
    </form>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/qr-scanner/qr-scanner.umd.min.js" defer></script>
  <script src="/static/platforms.js" defer></script>
  <script src="/static/main.js" defer></script>
</body>
</html>
